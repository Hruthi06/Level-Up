name: level_up
description: "LEVEL UP - AI-Powered Gamified Fitness RPG Mobile Application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management & DI
  flutter_riverpod: ^2.5.1

  # Navigation & Deep Linking
  go_router: ^14.0.0

  # Charts & Visualizations
  fl_chart: ^0.68.0

  # Typography & Design
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

  # Utilities & Local Storage
  intl: ^0.19.0
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

